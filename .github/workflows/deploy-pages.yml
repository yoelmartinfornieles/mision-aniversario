# Build the Vite app and publish to GitHub Pages.
# Optional secrets (baked into the client at build time):
#   VITE_GAS_WEBAPP_URL, VITE_GAS_MAIL_SECRET, VITE_AIRBNB_URL
# See scripts/google-apps-script/README.md

name: Deploy GitHub Pages

on:
  push:
    branches: [aniversary, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        working-directory: app
        run: npm ci

      - name: Build
        working-directory: app
        env:
          VITE_GAS_WEBAPP_URL: ${{ secrets.VITE_GAS_WEBAPP_URL }}
          VITE_GAS_MAIL_SECRET: ${{ secrets.VITE_GAS_MAIL_SECRET }}
          VITE_AIRBNB_URL: ${{ secrets.VITE_AIRBNB_URL }}
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
