# One-shot: reintento de invitación + finale de prueba.
# Destino: TEST_EMAIL_TO (default en el script: fan_cassidy@hotmail.com).
#
# Secrets: GAS_WEBAPP_URL, GAS_MAIL_SECRET, SITE_URL
# Optional secret: AIRBNB_URL (link en el mail de cierre)
# Tras la prueba: borra o desactiva este workflow.

name: Test emails (retry)

on:
  schedule:
    # 17:00 Europe/Madrid (CEST, UTC+2) · 19 octubre 2026 → 15:00 UTC
    - cron: '0 15 19 10 *'
  workflow_dispatch:

jobs:
  send-test-emails:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Send both test emails
        env:
          GAS_WEBAPP_URL: ${{ secrets.GAS_WEBAPP_URL }}
          GAS_MAIL_SECRET: ${{ secrets.GAS_MAIL_SECRET }}
          SITE_URL: ${{ secrets.SITE_URL }}
          AIRBNB_URL: ${{ secrets.AIRBNB_URL }}
          TEST_EMAIL_TO: fan_cassidy@hotmail.com
        run: node scripts/send-test-emails.mjs
